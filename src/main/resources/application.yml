spring:
    config:
        import:
            - optional:file:.env[.properties]
            - classpath:routes.yml
        activate:
            on-profile: default
    application:
        name: X3_Gateway

server:
    port: ${PORT}

logging:
    level:
        org.springframework: INFO
        com.unknown.gateway: DEBUG
    file:
        name: src/main/resources/logging/user-ms.log
    logback:
        rollingpolicy:
            max-file-size: 10MB
            max-history: 10
